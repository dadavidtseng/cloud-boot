[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cloud-boot"
version = "0.1.0"
description = "Reproducible Ubuntu cloud-init testing and diagnostics on QEMU/KVM"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Boot",
]
dependencies = [
  "pydantic>=2.10,<3",
  "pycdlib>=1.14,<2",
  "PyYAML>=6.0,<7",
]

# Tools for developing this repository; not required to use cloud-boot.
[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy==2.4.1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff==0.17.3",
  "types-PyYAML>=6.0,<7",
]
# Builds the documentation site: `uv run --locked --group docs sphinx-build ...`.
docs = [
  "furo>=2025.12.19",
  "myst-parser>=5.2,<6",
  "sphinx>=9.1,<10",
]

[project.urls]
Repository = "https://github.com/dadavidtseng/cloud-boot"
Issues = "https://github.com/dadavidtseng/cloud-boot/issues"

[project.scripts]
cloud-boot = "cloud_boot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_boot"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/pyproject.toml",
  "/src/cloud_boot",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["cloud_boot"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ['if (typing\.)?TYPE_CHECKING:']

[tool.ruff]
target-version = "py312"
line-length = 102
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
  "B",     # flake8-bugbear: likely bugs
  "C4",    # flake8-comprehensions
  "D",     # pydocstyle
  "E",     # pycodestyle errors
  "F",     # Pyflakes
  "G",     # Logging format correctness and lazy interpolation
  "I",     # isort
  "ISC",   # Implicit string concatenation, including missing commas
  "PIE",   # Miscellaneous mistakes
  "PT",    # pytest style
  "RUF",   # Ruff-specific rules
  "S506",  # Unsafe YAML loading
  "S602",  # Subprocess calls with shell=True
  "SIM",   # Simplification
  "T10",   # Leftover debugger calls
  "UP",    # Modern Python syntax
  "W",     # pycodestyle warnings
]
ignore = [
  "D105",  # Magic methods are documented by the language
  "D107",  # Constructor arguments belong in the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["cloud_boot"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # Test names describe the behavior under test
